version = 3.9.1
runner.dialect = scala3

align.preset = more
maxColumn = 100
continuationIndent.defnSite = 4
continuationIndent.callSite = 4
align.openParenCallSite = true
align.openParenDefnSite = true
align.tokens = ["%", "->", "=>", ":=", ":"]
indent.main = 3
align.multiline = true
spaces.inParentheses = true
